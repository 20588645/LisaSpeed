<?xml version="1.0" encoding="UTF-8"?>
<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- LisaSpeed app icon - Concept A: glass power orb on deep navy -->
  <defs>
    <clipPath id="sq"><rect x="0" y="0" width="1024" height="1024" rx="232"/></clipPath>
    <radialGradient id="bg" cx="50%" cy="36%" r="80%">
      <stop offset="0%" stop-color="#152741"/>
      <stop offset="55%" stop-color="#0B1424"/>
      <stop offset="100%" stop-color="#060A12"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2EE6C5" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#2EE6C5" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#2EE6C5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vig" cx="50%" cy="46%" r="72%">
      <stop offset="62%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.32"/>
    </radialGradient>
    <pattern id="grid" width="128" height="128" patternUnits="userSpaceOnUse">
      <path d="M128 0H0V128" fill="none" stroke="#7DFFD2" stroke-opacity="0.05" stroke-width="2"/>
    </pattern>
    <linearGradient id="comet" x1="731.5" y1="358.3" x2="646" y2="744.1" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A9FFE7"/>
      <stop offset="42%" stop-color="#2EE6C5"/>
      <stop offset="100%" stop-color="#2EE6C5" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="disc" x1="512" y1="306" x2="512" y2="718" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1B2E4A"/>
      <stop offset="100%" stop-color="#0B1626"/>
    </linearGradient>
    <radialGradient id="discHi" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glyph" x1="512" y1="340" x2="512" y2="624" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F4FFFC"/>
      <stop offset="45%" stop-color="#7DFFD2"/>
      <stop offset="100%" stop-color="#26DDBB"/>
    </linearGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="soft2" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <g clip-path="url(#sq)">
    <rect width="1024" height="1024" fill="url(#bg)"/>
    <rect width="1024" height="1024" fill="url(#grid)"/>
    <circle cx="512" cy="480" r="360" fill="url(#glow)"/>

    <!-- grounding shadow -->
    <ellipse cx="512" cy="758" rx="212" ry="38" fill="#000000" opacity="0.35" filter="url(#soft)"/>

    <!-- comet ring: dim track + bright arc -->
    <circle cx="512" cy="512" r="268" stroke="#2EE6C5" stroke-opacity="0.14" stroke-width="46" fill="none"/>
    <path d="M646 744.1 A268 268 0 1 1 731.5 358.3" stroke="url(#comet)" stroke-width="46" stroke-linecap="round" fill="none"/>
    <circle cx="731.5" cy="358.3" r="27" fill="#C6FFEF" filter="url(#soft2)"/>
    <circle cx="731.5" cy="358.3" r="17" fill="#EFFFFB"/>

    <!-- glass disc -->
    <circle cx="512" cy="512" r="206" fill="url(#disc)"/>
    <circle cx="512" cy="512" r="206" fill="url(#discHi)"/>
    <circle cx="512" cy="512" r="204.5" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="3" fill="none"/>

    <!-- power glyph glow -->
    <g filter="url(#soft)" opacity="0.55" stroke="#2EE6C5" stroke-width="46" stroke-linecap="round" fill="none">
      <path d="M586.9 428.8 A112 112 0 1 1 437.1 428.8"/>
      <path d="M512 348 L512 506"/>
    </g>
    <!-- power glyph -->
    <g stroke="url(#glyph)" stroke-width="42" stroke-linecap="round" fill="none">
      <path d="M586.9 428.8 A112 112 0 1 1 437.1 428.8"/>
      <path d="M512 348 L512 506"/>
    </g>

    <rect width="1024" height="1024" fill="url(#vig)"/>
    <rect x="1.5" y="1.5" width="1021" height="1021" rx="230.5" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="3" fill="none"/>
  </g>
</svg>
