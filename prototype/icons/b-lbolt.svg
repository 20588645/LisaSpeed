<?xml version="1.0" encoding="UTF-8"?>
<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- LisaSpeed app icon - Concept B: speed-L monogram on deep navy -->
  <defs>
    <clipPath id="sq"><rect x="0" y="0" width="1024" height="1024" rx="232"/></clipPath>
    <radialGradient id="bg" cx="50%" cy="36%" r="80%">
      <stop offset="0%" stop-color="#152741"/>
      <stop offset="55%" stop-color="#0B1424"/>
      <stop offset="100%" stop-color="#060A12"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2EE6C5" stop-opacity="0.20"/>
      <stop offset="60%" stop-color="#2EE6C5" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#2EE6C5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vig" cx="50%" cy="46%" r="72%">
      <stop offset="62%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.32"/>
    </radialGradient>
    <pattern id="grid" width="128" height="128" patternUnits="userSpaceOnUse">
      <path d="M128 0H0V128" fill="none" stroke="#7DFFD2" stroke-opacity="0.05" stroke-width="2"/>
    </pattern>
    <linearGradient id="mint" x1="440" y1="250" x2="700" y2="720" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#EFFFFA"/>
      <stop offset="42%" stop-color="#7DFFD2"/>
      <stop offset="100%" stop-color="#24D9B8"/>
    </linearGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
  </defs>

  <g clip-path="url(#sq)">
    <rect width="1024" height="1024" fill="url(#bg)"/>
    <rect width="1024" height="1024" fill="url(#grid)"/>
    <circle cx="540" cy="480" r="360" fill="url(#glow)"/>

    <!-- monogram: slanted L + speed chevrons -->
    <g transform="translate(512 480) skewX(-8) translate(-512 -480)">
      <!-- glow copy -->
      <g filter="url(#soft)" opacity="0.5" fill="#2EE6C5">
        <rect x="368" y="252" width="128" height="440" rx="52"/>
        <rect x="368" y="564" width="304" height="128" rx="52"/>
      </g>
      <g fill="url(#mint)">
        <rect x="368" y="252" width="128" height="440" rx="52"/>
        <rect x="368" y="564" width="304" height="128" rx="52"/>
      </g>
      <g stroke="url(#mint)" stroke-width="70" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <path d="M712 546 L800 628 L712 710"/>
      </g>
      <g stroke="#2EE6C5" stroke-width="54" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.38">
        <path d="M836 566 L902 628 L836 690"/>
      </g>
    </g>

    <rect width="1024" height="1024" fill="url(#vig)"/>
    <rect x="1.5" y="1.5" width="1021" height="1021" rx="230.5" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="3" fill="none"/>
  </g>
</svg>
